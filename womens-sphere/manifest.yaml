# Static-site manifest for the Women's Sphere Module SBA (READ 1000).
#
#   npm run build   # once, to compile grammars/registries
#   ./node_modules/.bin/tsx scripts/build-static.ts --manifest <this file>
#
# Output lands in dist/womens_sphere/. The event websocket is enabled via PMSS
# (.static { websocket: true; }) at deploy time; the client connects to the
# same-origin /wsapi/ endpoint.
#
# Its own namespace: block ids are namespace-qualified, so this form's ids
# never collide with the temperance form's even though both use the same
# module format. The namespace is declared here, so the directory name is
# free to carry a hyphen; asset URLs key off the directory name.
title: "READ 1000 — Women's Sphere Module"
namespace: womens_sphere
content_root: .
classes:
  - no-translanguaging
# Three sources, three licenses. Keep all three parts: the middle one is a
# CC BY-SA condition, not a courtesy.
content_notice: >
  Course content Copyright &copy; 2026 by Timothy Nelson, Rebecca McIntyre,
  Allison Brown, Michele Abernathy, Ben Pierce, and Piotr Mitros. Licensed under
  [AGPLv3](https://www.gnu.org/licenses/agpl-3.0.html); source available at
  [github.com/olxhub/edu.mtsu.transitional-reading](https://github.com/olxhub/edu.mtsu.transitional-reading/).
  Textbook excerpts are adapted from *The American Yawp*, Chapter 11,
  ["The Cotton Revolution"](https://www.americanyawp.com/text/11-the-cotton-revolution/),
  copyright [the American Yawp](https://www.americanyawp.com/) contributors, licensed
  [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/); the chapter has
  been excerpted, generalized, and split into parts, reading instructions added, and
  internal cuts marked "&hellip;"; those adaptations are likewise CC BY-SA 4.0.
  "The Sphere of Woman," an engraving from *Godey's Lady's Book* vol. 40 (March 1850),
  is in the public domain.
routes:
  # "/" lands on the consent gate (womens_sphere_study.olx); the module renders inside it
  # once the consent question is answered, either way. A deployment outside a
  # study points "/" at womens_sphere/womens_sphere_module instead.
  "/": womens_sphere/womens_sphere_study
